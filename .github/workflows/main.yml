name: Build AI Studio Universal Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Optimize Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Android SDK Paths & Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          echo "BUILD_TOOLS_PATH=$BUILD_TOOLS_DIR" >> $GITHUB_ENV
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

      - name: 4. Deteksi / Siapkan Keystore
        run: |
          if [ -f "keystore/keystore.properties" ] && [ -f "keystore/release.jks" ]; then
            echo "Keystore resmi ditemukan di folder keystore/."
            KEYSTORE_FILE="keystore/release.jks"
            PASS=$(grep "^storePassword=" keystore/keystore.properties | cut -d'=' -f2 | tr -d '\r\n')
            ALIAS=$(grep "^keyAlias=" keystore/keystore.properties | cut -d'=' -f2 | tr -d '\r\n')
            KEYPASS=$(grep "^keyPassword=" keystore/keystore.properties | cut -d'=' -f2 | tr -d '\r\n')
            echo "SIGNING_KEYSTORE=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "SIGNING_PASS=${PASS:-androidrelease}" >> $GITHUB_ENV
            echo "SIGNING_ALIAS=${ALIAS:-releasekey}" >> $GITHUB_ENV
            echo "SIGNING_KEYPASS=${KEYPASS:-androidrelease}" >> $GITHUB_ENV
          elif [ -f "keystore/release.jks" ]; then
            echo "Keystore release.jks ditemukan."
            echo "SIGNING_KEYSTORE=keystore/release.jks" >> $GITHUB_ENV
            echo "SIGNING_PASS=androidrelease" >> $GITHUB_ENV
            echo "SIGNING_ALIAS=releasekey" >> $GITHUB_ENV
            echo "SIGNING_KEYPASS=androidrelease" >> $GITHUB_ENV
          else
            echo "Signing key belum ditemukan. Membuat keystore baru..."
            mkdir -p keystore
            keytool -genkey -v \
              -keystore keystore/release.jks \
              -alias releasekey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass androidrelease \
              -keypass androidrelease \
              -dname "CN=Vortex3D, OU=Mobile, O=AI, L=Jakarta, ST=Jakarta, C=ID"

            echo "storeFile=release.jks" > keystore/keystore.properties
            echo "storePassword=androidrelease" >> keystore/keystore.properties
            echo "keyAlias=releasekey" >> keystore/keystore.properties
            echo "keyPassword=androidrelease" >> keystore/keystore.properties

            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/
            git commit -m "ci: auto-generate release signing key [skip ci]" || echo "Tidak ada perubahan."
            git push origin HEAD:${{ github.ref_name }} || echo "Push dilewati atau branch terlindungi, lanjut build."

            echo "SIGNING_KEYSTORE=keystore/release.jks" >> $GITHUB_ENV
            echo "SIGNING_PASS=androidrelease" >> $GITHUB_ENV
            echo "SIGNING_ALIAS=releasekey" >> $GITHUB_ENV
            echo "SIGNING_KEYPASS=androidrelease" >> $GITHUB_ENV
          fi

      - name: 5. Auto-Heal, Injeksi Versi, & Konfigurasi Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - << 'EOF'
          import os, re, shutil

          build_num = os.environ.get("BUILD_NUMBER", "1")
          ks_source = os.environ.get("SIGNING_KEYSTORE", "keystore/release.jks")

          # 1. Pastikan local.properties ada
          android_home = os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk")
          with open("local.properties", "w") as f:
              f.write(f"sdk.dir={android_home}\n")

          # 2. Perbaiki gradle.properties
          gradle_props = "gradle.properties"
          props_content = ""
          if os.path.exists(gradle_props):
              with open(gradle_props, "r") as f:
                  props_content = f.read()

          props_content = re.sub(r'android\.enableR8\s*=\s*.*?\n', '\n', props_content)

          opt_flags = [
              "android.useAndroidX=true",
              "org.gradle.jvmargs=-Xmx2048m -XX:+UseG1GC -Dfile.encoding=UTF-8"
          ]
          for flag in opt_flags:
              key = flag.split("=")[0]
              if key not in props_content:
                  props_content += f"\n{flag}"
          with open(gradle_props, "w") as f:
              f.write(props_content)

          # 3. Modifikasi build.gradle / build.gradle.kts
          target_build = "app/build.gradle.kts"
          if not os.path.exists(target_build):
              if os.path.exists("app/build.gradle"):
                  target_build = "app/build.gradle"
              elif os.path.exists("build.gradle.kts"):
                  target_build = "build.gradle.kts"
              elif os.path.exists("build.gradle"):
                  target_build = "build.gradle"

          if os.path.exists(target_build):
              with open(target_build, "r") as f:
                  content = f.read()

              # Tangani keystore fiktif jika ada referensi path
              ks_matches = re.findall(r'[\'"]([^\'"]+\.(?:jks|keystore))[\'"]', content)
              if os.path.exists(ks_source):
                  for ks in ks_matches:
                      ks_filename = os.path.basename(ks)
                      for loc in [ks_filename, os.path.join("app", ks_filename), ks]:
                          try:
                              os.makedirs(os.path.dirname(loc) or ".", exist_ok=True)
                              if not os.path.exists(loc):
                                  shutil.copy(ks_source, loc)
                          except Exception:
                              pass

              # Netralkan signingConfig bawaan agar dikontrol langsung dan seragam oleh apksigner di CI
              content = re.sub(r'(?m)^(\s*)(signingConfig\s*=?\s*signingConfigs.*)$', r'\1// [CI AUTO-FIX] \2', content)

              # Peningkatan Versi Otomatis
              content = re.sub(r'versionCode\s+\d+', f'versionCode {build_num}', content)
              content = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {build_num}', content)
              content = re.sub(r'versionName\s+["\'][^"\']+["\']', f'versionName "1.0.{build_num}"', content)
              content = re.sub(r'versionName\s*=\s*["\'][^"\']+["\']', f'versionName = "1.0.{build_num}"', content)

              # JANGAN paksa isMinifyEnabled = true jika proyek menggunakan Jetpack Compose & model tanpa full keep rules
              # Pertahankan nilai asli build file agar dex dan class bytecode aman serta tidak corrupt

              with open(target_build, "w") as f:
                  f.write(content)

              print(f"File {target_build} sukses diamankan: versionCode={build_num}")
          EOF

      - name: 6. Validasi Wrapper & Tentukan Eksekutor Gradle
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper || true
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_BIN=./gradlew" >> $GITHUB_ENV
          else
            echo "GRADLE_BIN=gradle" >> $GITHUB_ENV
          fi

      - name: 7. Compile Release APK (Strictly ARM64 64-bit)
        run: |
          $GRADLE_BIN assembleRelease \
            --no-daemon \
            --stacktrace

      - name: 8. Page-Alignment, Signature (V1+V2+V3) & Strict 64-bit Validation
        run: |
          echo "Mencari file APK..."
          RAW_APK=$(find . -type f -name "*.apk" ! -name "*aligned*" | grep -i "release" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find . -type f -name "*.apk" ! -name "*aligned*" | head -n 1)
          fi

          if [ -z "$RAW_APK" ]; then
            echo "ERROR: Tidak ada file APK yang ditemukan setelah assembleRelease!"
            exit 1
          fi

          echo "APK Terpilih: $RAW_APK"

          # 1. Zipalign APK dengan 4KB (-p) page-align
          zipalign -f -p 4 "$RAW_APK" aligned.apk
          zipalign -c -p 4 aligned.apk && echo "Zipalign 4KB page-alignment sukses terverifikasi!"

          # 2. Tandatangani secara penuh dengan Skema V1, V2, V3
          apksigner sign \
            --ks "$SIGNING_KEYSTORE" \
            --ks-pass pass:"$SIGNING_PASS" \
            --ks-key-alias "$SIGNING_ALIAS" \
            --key-pass pass:"${SIGNING_KEYPASS:-$SIGNING_PASS}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out app-arm64-release.apk \
            aligned.apk

          # 3. Validasi ketat arsitektur 64-bit (ARM64 Only)
          echo "Memeriksa isi arsitektur native .so dalam APK..."
          SO_FILES=$(unzip -l app-arm64-release.apk | grep "\.so$" || true)
          echo "$SO_FILES"

          if echo "$SO_FILES" | grep -q "armeabi-v7a\|x86\|x86_64"; then
            echo "ERROR: Ditemukan library 32-bit atau x86 di dalam APK! Aplikasi wajib 100% ARM64 64-bit."
            exit 1
          else
            echo "SUKSES: APK terverifikasi bersih dan hanya mengandung arsitektur arm64-v8a (64-bit)!"
          fi

          # 4. Verifikasi tanda tangan secara detail (-v)
          apksigner verify -v --print-certs app-arm64-release.apk

          echo "Ukuran APK Final (ARM64 Only):"
          ls -lh app-arm64-release.apk

      - name: 9. Unggah Artefak APK ARM64 64-bit
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-release
          path: app-arm64-release.apk
          if-no-files-found: error
          overwrite: true
