name: Build AI Studio arm64 Ultra-Light APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write # Diperlukan untuk auto-push keystore ke repositori

jobs:
  build:
    name: Build & Optimize Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Android SDK Paths & Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          echo "BUILD_TOOLS_PATH=$BUILD_TOOLS_DIR" >> $GITHUB_ENV
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

      - name: 4. Deteksi / Buat Keystore & Auto-Push ke Repo
        run: |
          # Periksa apakah sudah ada file keystore (*.jks / *.keystore) di dalam repo
          KEYSTORE_FILE=$(find . -maxdepth 2 -type f \( -name "*.jks" -o -name "*.keystore" \) | head -n 1)

          if [ -z "$KEYSTORE_FILE" ]; then
            echo "Signing key belum ditemukan. Membuat keystore baru..."
            mkdir -p keystore
            keytool -genkey -v \
              -keystore keystore/release.jks \
              -alias releasekey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass androidrelease \
              -keypass androidrelease \
              -dname "CN=AIStudioApp, OU=Mobile, O=AI, L=Jakarta, ST=Jakarta, C=ID"

            echo "storeFile=release.jks" > keystore/keystore.properties
            echo "storePassword=androidrelease" >> keystore/keystore.properties
            echo "keyAlias=releasekey" >> keystore/keystore.properties
            echo "keyPassword=androidrelease" >> keystore/keystore.properties

            # Push keystore ke repositori agar update masa depan selalu cocok signature-nya
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/
            git commit -m "ci: auto-generate release signing key [skip ci]" || echo "Tidak ada perubahan."
            git push origin HEAD:${{ github.ref_name }} || echo "Push dilewati atau branch terlindungi, lanjut build."
            
            echo "SIGNING_KEYSTORE=keystore/release.jks" >> $GITHUB_ENV
          else
            echo "Signing key ditemukan: $KEYSTORE_FILE"
            echo "SIGNING_KEYSTORE=$KEYSTORE_FILE" >> $GITHUB_ENV
          fi
          echo "SIGNING_PASS=androidrelease" >> $GITHUB_ENV
          echo "SIGNING_ALIAS=releasekey" >> $GITHUB_ENV

      - name: 5. Auto-Heal Project, Auto-Version, & Injeksi Optimasi R8
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - << 'EOF'
          import os, re

          build_num = os.environ.get("BUILD_NUMBER", "1")

          # 1. Pastikan local.properties ada
          android_home = os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk")
          with open("local.properties", "w") as f:
              f.write(f"sdk.dir={android_home}\n")

          # 2. Paksa R8 Full Mode & Optimasi di gradle.properties
          gradle_props = "gradle.properties"
          props_content = ""
          if os.path.exists(gradle_props):
              with open(gradle_props, "r") as f:
                  props_content = f.read()

          opt_flags = [
              "android.useAndroidX=true",
              "android.enableR8=true",
              "android.enableR8.fullMode=true",
              "org.gradle.jvmargs=-Xmx2048m -XX:+UseG1GC -Dfile.encoding=UTF-8"
          ]
          for flag in opt_flags:
              key = flag.split("=")[0]
              if key not in props_content:
                  props_content += f"\n{flag}"
          with open(gradle_props, "w") as f:
              f.write(props_content)

          # 3. Buat proguard-rules.pro aman jika belum ada
          proguard_path = "app/proguard-rules.pro"
          if not os.path.exists("app"):
              proguard_path = "proguard-rules.pro"
          if not os.path.exists(proguard_path):
              os.makedirs(os.path.dirname(proguard_path) or ".", exist_ok=True)
              with open(proguard_path, "w") as f:
                  f.write("-dontwarn **\n-keepattributes *Annotation*,Signature\n")

          # 4. Modifikasi build.gradle / build.gradle.kts untuk Auto-Version & R8
          target_build = "app/build.gradle"
          if not os.path.exists(target_build):
              if os.path.exists("app/build.gradle.kts"):
                  target_build = "app/build.gradle.kts"
              elif os.path.exists("build.gradle"):
                  target_build = "build.gradle"

          if os.path.exists(target_build):
              with open(target_build, "r") as f:
                  content = f.read()

              # --- PENINGKATAN VERSI OTOMATIS (Mendukung Groovy & Kotlin DSL) ---
              content = re.sub(r'versionCode\s+\d+', f'versionCode {build_num}', content)
              content = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {build_num}', content)
              content = re.sub(r'versionName\s+["\'][^"\']+["\']', f'versionName "1.0.{build_num}"', content)
              content = re.sub(r'versionName\s*=\s*["\'][^"\']+["\']', f'versionName = "1.0.{build_num}"', content)

              # --- AKTIFKAN R8 & RESOURCE SHRINKING ---
              content = re.sub(r'minifyEnabled\s+false', 'minifyEnabled true', content)
              content = re.sub(r'shrinkResources\s+false', 'shrinkResources true', content)
              content = re.sub(r'isMinifyEnabled\s*=\s*false', 'isMinifyEnabled = true', content)
              content = re.sub(r'isShrinkResources\s*=\s*false', 'isShrinkResources = true', content)

              with open(target_build, "w") as f:
                  f.write(content)

              print(f"File {target_build} sukses diperbarui: versionCode={build_num}, versionName=1.0.{build_num}")
          EOF

      - name: 6. Validasi & Regenerasi Gradle Wrapper jika Hilang
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper tidak ditemukan! Membangun wrapper baru..."
            gradle wrapper --gradle-version 8.7 --distribution-type bin || true
          fi
          chmod +x ./gradlew || true

      - name: 7. Compile Release APK (Khusus Arsitektur arm64-v8a)
        run: |
          # Build APK release khusus arsitektur arm64-v8a untuk ukuran paling minimal
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: 8. Alignment & Penandatanganan APK (1 File Final)
        run: |
          RAW_APK=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "ERROR: APK release tidak ditemukan!"
            exit 1
          fi
          echo "APK Ditemukan: $RAW_APK"

          # 1. Zipalign APK
          zipalign -p -f -v 4 "$RAW_APK" unaligned-signed.apk

          # 2. Tandatangani APK dengan apksigner
          apksigner sign \
            --ks "$SIGNING_KEYSTORE" \
            --ks-pass pass:"$SIGNING_PASS" \
            --ks-key-alias "$SIGNING_ALIAS" \
            --key-pass pass:"$SIGNING_PASS" \
            --out app-arm64-v8a-ultra-release.apk \
            unaligned-signed.apk

          # 3. Verifikasi signature APK
          apksigner verify app-arm64-v8a-ultra-release.apk

          echo "Ukuran APK Final:"
          ls -lh app-arm64-v8a-ultra-release.apk

      - name: 9. Unggah Artefak (1 File Tunggal & Mendukung Timpa Update)
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: app-arm64-v8a-ultra-release.apk
          if-no-files-found: error
          overwrite: true # Menimpa file artefak lama jika build ulang dijalankan
