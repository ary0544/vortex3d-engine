name: Build AI Studio arm64 Ultra-Light APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Optimize Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Android SDK Paths & Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          echo "BUILD_TOOLS_PATH=$BUILD_TOOLS_DIR" >> $GITHUB_ENV
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

      - name: 4. Deteksi / Buat Keystore & Auto-Push ke Repo
        run: |
          KEYSTORE_FILE=$(find . -maxdepth 2 -type f \( -name "*.jks" -o -name "*.keystore" \) | head -n 1)

          if [ -z "$KEYSTORE_FILE" ]; then
            echo "Signing key belum ditemukan. Membuat keystore baru..."
            mkdir -p keystore
            keytool -genkey -v \
              -keystore keystore/release.jks \
              -alias releasekey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass androidrelease \
              -keypass androidrelease \
              -dname "CN=AIStudioApp, OU=Mobile, O=AI, L=Jakarta, ST=Jakarta, C=ID"

            echo "storeFile=release.jks" > keystore/keystore.properties
            echo "storePassword=androidrelease" >> keystore/keystore.properties
            echo "keyAlias=releasekey" >> keystore/keystore.properties
            echo "keyPassword=androidrelease" >> keystore/keystore.properties

            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/
            git commit -m "ci: auto-generate release signing key [skip ci]" || echo "Tidak ada perubahan."
            git push origin HEAD:${{ github.ref_name }} || echo "Push dilewati atau branch terlindungi, lanjut build."
            
            echo "SIGNING_KEYSTORE=keystore/release.jks" >> $GITHUB_ENV
          else
            echo "Signing key ditemukan: $KEYSTORE_FILE"
            echo "SIGNING_KEYSTORE=$KEYSTORE_FILE" >> $GITHUB_ENV
          fi
          echo "SIGNING_PASS=androidrelease" >> $GITHUB_ENV
          echo "SIGNING_ALIAS=releasekey" >> $GITHUB_ENV

      - name: 5. Auto-Heal, Proguard Protection, & Injeksi Versi
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - << 'EOF'
          import os, re, shutil

          build_num = os.environ.get("BUILD_NUMBER", "1")
          ks_source = os.environ.get("SIGNING_KEYSTORE", "keystore/release.jks")

          # 1. Pastikan local.properties ada
          android_home = os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk")
          with open("local.properties", "w") as f:
              f.write(f"sdk.dir={android_home}\n")

          # 2. Perbaiki gradle.properties
          gradle_props = "gradle.properties"
          props_content = ""
          if os.path.exists(gradle_props):
              with open(gradle_props, "r") as f:
                  props_content = f.read()

          props_content = re.sub(r'android\.enableR8\s*=\s*.*?\n', '\n', props_content)

          opt_flags = [
              "android.useAndroidX=true",
              "org.gradle.jvmargs=-Xmx2048m -XX:+UseG1GC -Dfile.encoding=UTF-8"
          ]
          for flag in opt_flags:
              key = flag.split("=")[0]
              if key not in props_content:
                  props_content += f"\n{flag}"
          with open(gradle_props, "w") as f:
              f.write(props_content)

          # 3. Proteksi Komponen Android di Proguard Rules agar APK tidak corrupt
          proguard_rules = """
          -dontwarn **
          -keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod
          -keep public class * extends android.app.Activity
          -keep public class * extends android.app.Application
          -keep public class * extends android.app.Service
          -keep public class * extends android.content.BroadcastReceiver
          -keep public class * extends android.content.ContentProvider
          -keep public class * extends android.view.View { public <init>(...); }
          -keepclasseswithmembers class * { public static void main(java.lang.String[]); }
          """
          for p_path in ["app/proguard-rules.pro", "proguard-rules.pro"]:
              os.makedirs(os.path.dirname(p_path) or ".", exist_ok=True)
              with open(p_path, "a+") as f:
                  f.write(proguard_rules)

          # 4. Modifikasi build.gradle / build.gradle.kts
          target_build = "app/build.gradle.kts"
          if not os.path.exists(target_build):
              if os.path.exists("app/build.gradle"):
                  target_build = "app/build.gradle"
              elif os.path.exists("build.gradle.kts"):
                  target_build = "build.gradle.kts"
              elif os.path.exists("build.gradle"):
                  target_build = "build.gradle"

          if os.path.exists(target_build):
              with open(target_build, "r") as f:
                  content = f.read()

              # Tangani keystore fiktif
              ks_matches = re.findall(r'[\'"]([^\'"]+\.(?:jks|keystore))[\'"]', content)
              if os.path.exists(ks_source):
                  for ks in ks_matches:
                      ks_filename = os.path.basename(ks)
                      for loc in [ks_filename, os.path.join("app", ks_filename), ks]:
                          try:
                              os.makedirs(os.path.dirname(loc) or ".", exist_ok=True)
                              if not os.path.exists(loc):
                                  shutil.copy(ks_source, loc)
                          except Exception:
                              pass

              # Netralkan signingConfig bawaan agar dikontrol langsung oleh CI
              content = re.sub(r'(?m)^(\s*)(signingConfig\s*=?\s*signingConfigs.*)$', r'\1// [CI AUTO-FIX] \2', content)

              # Peningkatan Versi Otomatis
              content = re.sub(r'versionCode\s+\d+', f'versionCode {build_num}', content)
              content = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {build_num}', content)
              content = re.sub(r'versionName\s+["\'][^"\']+["\']', f'versionName "1.0.{build_num}"', content)
              content = re.sub(r'versionName\s*=\s*["\'][^"\']+["\']', f'versionName = "1.0.{build_num}"', content)

              # Aktifkan Minify tapi amankan resource shrinking
              content = re.sub(r'minifyEnabled\s+false', 'minifyEnabled true', content)
              content = re.sub(r'isMinifyEnabled\s*=\s*false', 'isMinifyEnabled = true', content)

              with open(target_build, "w") as f:
                  f.write(content)

              print(f"File {target_build} sukses diamankan: versionCode={build_num}")
          EOF

      - name: 6. Validasi Wrapper & Tentukan Eksekutor Gradle
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper || true
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_BIN=./gradlew" >> $GITHUB_ENV
          else
            echo "GRADLE_BIN=gradle" >> $GITHUB_ENV
          fi

      - name: 7. Compile Release APK (Khusus Arsitektur arm64-v8a)
        run: |
          $GRADLE_BIN assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: 8. Alignment & Penandatanganan Resmi (V1 + V2 + V3 Signature)
        run: |
          echo "Mencari file APK..."
          RAW_APK=$(find . -type f -name "*.apk" ! -name "*aligned*" ! -name "*ultra*" | grep -i "release" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find . -type f -name "*.apk" ! -name "*aligned*" ! -name "*ultra*" | head -n 1)
          fi

          echo "APK Terpilih: $RAW_APK"

          # 1. Zipalign APK (Standar 4-byte alignment)
          zipalign -f -v 4 "$RAW_APK" aligned.apk

          # 2. Tandatangani secara penuh dengan Skema V1 (JAR), V2 (Full APK), dan V3
          apksigner sign \
            --ks "$SIGNING_KEYSTORE" \
            --ks-pass pass:"$SIGNING_PASS" \
            --ks-key-alias "$SIGNING_ALIAS" \
            --key-pass pass:"$SIGNING_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out app-arm64-v8a-ultra-release.apk \
            aligned.apk

          # 3. Verifikasi tanda tangan secara detail (-v)
          echo "Hasil Verifikasi Signature:"
          apksigner verify -v --print-certs app-arm64-v8a-ultra-release.apk

          echo "Ukuran APK Final:"
          ls -lh app-arm64-v8a-ultra-release.apk

      - name: 9. Unggah Artefak (1 File Tunggal & Mendukung Timpa Update)
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: app-arm64-v8a-ultra-release.apk
          if-no-files-found: error
          overwrite: true
